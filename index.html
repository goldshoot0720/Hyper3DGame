<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>喵喵卡丁車 Meow Kart</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <!-- 載入畫面 -->
    <div id="loading" class="screen">
      <div class="loading-box">
        <h1 class="logo">喵喵卡丁車</h1>
        <div class="bar"><div id="loading-bar"></div></div>
        <p id="loading-text">載入中…</p>
      </div>
    </div>

    <!-- 角色選擇 -->
    <div id="select" class="screen hidden">
      <h2 class="title">選擇角色</h2>
      <div id="roster" class="roster"></div>
      <div class="select-footer">
        <div id="stats" class="stats"></div>
        <div class="opts">
          <label>圈數
            <select id="lap-count">
              <option value="1">1</option>
              <option value="3" selected>3</option>
              <option value="5">5</option>
            </select>
          </label>
          <label>對手
            <select id="ai-count">
              <option value="3">3</option>
              <option value="5" selected>5</option>
              <option value="7">7</option>
            </select>
          </label>
          <label>難度
            <select id="difficulty">
              <option value="easy">輕鬆</option>
              <option value="normal" selected>普通</option>
              <option value="hard">困難</option>
            </select>
          </label>
        </div>
        <button id="start-btn" class="btn-primary">開始比賽</button>
      </div>
    </div>

    <!-- 遊戲 HUD -->
    <div id="hud" class="hidden">
      <div id="hud-top-left">
        <div class="pill" id="lap-display">LAP 1/3</div>
        <div class="pill" id="pos-display">1<span class="sup">st</span></div>
        <div class="pill" id="time-display">0:00.00</div>
      </div>
      <canvas id="minimap" width="200" height="200"></canvas>
      <div id="item-slot"><div id="item-icon"></div></div>
      <div id="speedo">
        <svg viewBox="0 0 120 120" id="speedo-svg">
          <circle class="ring-bg" cx="60" cy="60" r="50" />
          <circle class="ring-fg" id="speed-ring" cx="60" cy="60" r="50" />
        </svg>
        <div id="speed-value">0</div>
        <div id="speed-unit">km/h</div>
      </div>
      <div id="boost-gauge"><div id="boost-fill"></div></div>
      <div id="countdown"></div>
      <div id="toast"></div>
      <div id="standings"></div>
    </div>

    <!-- 結算 -->
    <div id="results" class="screen hidden">
      <h2 class="title" id="result-title">比賽結束</h2>
      <table id="result-table"></table>
      <div class="result-actions">
        <button id="retry-btn" class="btn-primary">再來一場</button>
        <button id="menu-btn" class="btn-ghost">回角色選擇</button>
      </div>
    </div>

    <!-- 手機觸控 -->
    <div id="touch" class="hidden">
      <div class="tpad tleft" data-key="left">◀</div>
      <div class="tpad tright" data-key="right">▶</div>
      <div class="tpad tdrift" data-key="drift">漂移</div>
      <div class="tpad titem" data-key="item">道具</div>
      <div class="tpad tgas" data-key="accel">加速</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
